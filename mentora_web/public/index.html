    <title>Mentora | منتورا</title>

    <script>
      // Disaster recovery for chunk loading errors / stale cache after deployment
      window.addEventListener('error', function (event) {
        var target = event.target;
        var isScriptOrCssFailure = target && !target.hasAttribute('data-mentora-optional') && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        var isChunkError = event.message && (
          event.message.indexOf('Loading chunk') !== -1 ||
          event.message.indexOf("Unexpected token '<'") !== -1 ||
          event.message.indexOf('Failed to fetch dynamically imported module') !== -1
        );

        if (isScriptOrCssFailure || isChunkError) {
          var RECOVERY_KEY = 'mentora_cache_recovery_ts';
          var lastRecovery = sessionStorage.getItem(RECOVERY_KEY);
          var now = Date.now();

          // Only auto-reload if not already reloaded in the last 15 seconds (prevents loops)
          if (!lastRecovery || (now - parseInt(lastRecovery, 10)) > 15000) {
            sessionStorage.setItem(RECOVERY_KEY, String(now));

            if ('caches' in window) {
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) { return caches.delete(name); }));
              }).then(function () {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function (regs) {
                    for (var r of regs) { r.unregister(); }
                  });
                }
                window.location.reload();
              }).catch(function () {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>برای استفاده از امکانات منتورا، باید جاوااسکریپت مرورگر خود را فعال کنید.</noscript>
    <div id="root"></div>
  </body>
